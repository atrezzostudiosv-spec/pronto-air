name: Verify Pronto Air Home screenshots
on:
  push:
    branches:
      - performance/home-psi-mobile-images-20261022
permissions:
  contents: read
jobs:
  compare-visual-home:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install screenshot comparison package
        run: python -m pip install --user "Pillow>=10,<13"
      - name: Prepare original Home document
        run: |
          git fetch --depth=1 origin main
          mkdir -p .image-compare/before
          git show origin/main:index.html > .image-compare/before/index.html
          ln -s "$GITHUB_WORKSPACE/images" .image-compare/before/images
          ln -s "$GITHUB_WORKSPACE/assets" .image-compare/before/assets
      - name: Compare Chromium screenshots in four viewport widths
        run: python tools/verify-home-browser.py
