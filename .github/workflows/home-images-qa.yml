name: Optimize and verify Pronto Air Home images
on:
  push:
    branches:
      - performance/home-psi-mobile-images-20261022
permissions:
  contents: write
jobs:
  optimize-home-assets:
    if: ${{ !contains(github.event.head_commit.message, '[assets-generated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Pillow
        run: python -m pip install --user "Pillow>=10,<13"
      - name: Capture original Home and build image variants
        run: |
          git fetch --depth=1 origin main
          mkdir -p .image-compare/before
          git show origin/main:index.html > .image-compare/before/index.html
          ln -s "$GITHUB_WORKSPACE/images" .image-compare/before/images
          ln -s "$GITHUB_WORKSPACE/assets" .image-compare/before/assets
          python tools/build-home-responsive-images.py
      - name: Verify dimensions, visual fidelity and unchanged indexation
        run: python tools/verify-home-assets.py
      - name: Commit only validated new image variants
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- images/home-hero-mobile-640.webp images/home-hero-mobile-820.webp images/pronto-home-family-team-840.webp images/pronto-home-family-team-1100.webp images/home-maintenance-tuneup-700.webp images/home-maintenance-tuneup-1000.webp
          if ! git diff --cached --quiet; then
            git commit -m "[assets-generated] Add responsive home image variants after visual QA"
            git push origin HEAD:performance/home-psi-mobile-images-20261022
          fi
