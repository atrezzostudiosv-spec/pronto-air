name: Diagnose live Cloudflare Worker health without secrets
on:
  push:
    branches: [fix/cloudflare-first-deploy-health-20261022]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check new tester syntax and mocked security
        run: |
          node --check tools/verify-cloudflare-live.mjs
          node tools/verify-conversational-worker.cjs
      - name: Probe actual deployed public endpoint without spending AI credits
        shell: bash
        run: |
          node - <<'JS'
          const url='https://pronto-air-assistant.atrezzostudiosv.workers.dev/health';
          (async()=>{
            try{
              const response=await fetch(url,{signal:AbortSignal.timeout(15000)});
              const body=(await response.text()).slice(0,350);
              console.log('Public Worker /health status:',response.status);
              console.log('Content type:',response.headers.get('content-type'));
              console.log('Body:',body.replace(/\s+/g,' '));
            }catch(e){
              console.log('Public Worker health probe error:',String(e));
              process.exitCode=1;
            }
          })();
          JS
