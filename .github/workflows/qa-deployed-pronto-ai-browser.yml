name: QA deployed Pronto Air AI in a real browser
on:
  push:
    branches: [qa/live-ai-browser-20261022]
permissions:
  contents: read
jobs:
  live-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium
      - name: Check deployed GitHub Pages, mobile Spanish AI reply and desktop UI
        run: node tools/verify-deployed-pronto-ai-browser.cjs
