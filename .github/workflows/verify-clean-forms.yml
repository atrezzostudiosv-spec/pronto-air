name: Test clean Home and Contact forms
on:
  push:
    branches: [forms/clean-confirmed-feedback-20261022]
permissions:
  contents: read
jobs:
  visual-form-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headless browser
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Validate cleaned layouts and submission feedback at four widths
        run: node tools/verify-clean-form-feedback.cjs
