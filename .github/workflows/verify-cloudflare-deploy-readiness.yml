name: Verify Pronto Air Cloudflare deploy readiness

on:
  push:
    branches: [ops/cloudflare-free-manual-deploy-20261022]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check source and deployment scripts
        run: |
          node --check assistant-worker/src/index.js
          node --check tools/verify-cloudflare-live.mjs
          node --check tools/attach-pronto-ai-endpoint.mjs
          node tools/attach-pronto-ai-endpoint.mjs https://validation.example.workers.dev/chat --check
      - name: Worker security tests using mocked inference
        run: node tools/verify-conversational-worker.cjs
      - name: Dry-run real Wrangler v4 bundling without credentials
        working-directory: assistant-worker
        run: npx --yes wrangler@4 deploy --dry-run --outdir /tmp/pronto-ai-worker-dist
      - name: Confirm compiled artifact exists
        run: |
          test -d /tmp/pronto-ai-worker-dist
          find /tmp/pronto-ai-worker-dist -maxdepth 2 -type f -print
