name: Temporary Contact mobile CSS regression

on:
  pull_request:
    paths:
      - 'tools/verify-contact-mobile-css-temp.cjs'
      - '.github/workflows/verify-contact-mobile-css-temp.yml'
permissions:
  contents: read

jobs:
  verify-contact:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser tools
        run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Compare base and candidate Contact at mobile, tablet, desktop, and no-JS mobile
        run: node tools/verify-contact-mobile-css-temp.cjs
