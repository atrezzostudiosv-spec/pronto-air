name: Verify conversational assistant and follow-up intake
on:
  push:
    branches: [feature/conversational-assistant-leads-20261022]
permissions:
  contents: read
jobs:
  conversational-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser audit dependencies
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1 @axe-core/playwright@4.10.2
          npx playwright install chromium
      - name: Preserve current public site as geometry baseline
        run: |
          git fetch --depth=1 origin main
          mkdir -p .assistant-qa-baseline
          for p in index.html residential-cooling.html residential-heating.html mobile-homes.html light-commercial.html contact-us.html service-agreement-faqs.html privacy-policy.html; do
            git show "origin/main:$p" > ".assistant-qa-baseline/$p"
          done
          ln -s "$GITHUB_WORKSPACE/assets" .assistant-qa-baseline/assets
          ln -s "$GITHUB_WORKSPACE/images" .assistant-qa-baseline/images
      - name: Validate Cloudflare conversational Worker without real AI
        run: node tools/verify-conversational-worker.cjs
      - name: Validate 8 pages, 4 breakpoints, callback form and chat mocks
        run: node tools/verify-conversational-assistant.cjs
