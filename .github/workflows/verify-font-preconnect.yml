name: Verify unchanged icon and typography rendering
on:
  push:
    branches: [performance/safe-font-connection-20261022]
permissions:
  contents: read
jobs:
  visual-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - name: Install image comparison dependency
        run: python -m pip install --user "Pillow>=10,<13"
      - name: Recreate approved baseline pages
        run: |
          git fetch --depth=1 origin main
          mkdir -p .font-qa/baseline
          for p in index.html residential-cooling.html residential-heating.html mobile-homes.html light-commercial.html contact-us.html service-agreement-faqs.html privacy-policy.html; do
            git show "origin/main:$p" > ".font-qa/baseline/$p"
          done
          ln -s "$GITHUB_WORKSPACE/images" .font-qa/baseline/images
          ln -s "$GITHUB_WORKSPACE/assets" .font-qa/baseline/assets
      - name: Verify identical content, exact fonts and icon styles, screenshot regression
        run: python tools/verify-safe-font-preconnect.py
