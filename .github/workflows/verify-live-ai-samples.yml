name: Test actual Pronto Air AI English and Spanish
on:
  push:
    branches: [feature/activate-live-cloudflare-ai-20261022]
permissions:
  contents: read
jobs:
  real-ai-samples:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify that eight demo pages have the same live AI endpoint and preserve noindex
        run: |
          node - <<'JS'
          const fs=require('fs'),assert=require('assert');
          const files=['index.html','residential-cooling.html','residential-heating.html','mobile-homes.html','light-commercial.html','contact-us.html','service-agreement-faqs.html','privacy-policy.html'];
          for(const path of files) {
            const html=fs.readFileSync(path,'utf8');
            assert.equal((html.match(/data-ai-endpoint=/g)||[]).length,1,path);
            assert.match(html,/data-ai-endpoint="https:\/\/pronto-air-assistant\.atrezzostudiosv\.workers\.dev\/chat"/,path);
            assert.match(html,/<meta name="robots" content="noindex, nofollow">/,path);
          }
          console.log('PASS all eight live endpoints and noindex.');
          JS
      - name: Ask one real model sample in each supported language and review safety topics
        run: node tools/verify-cloudflare-live-sample.mjs
