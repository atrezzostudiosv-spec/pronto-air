name: Validate temporary form wiring
on:
  push:
    branches:
      - forms/temporary-atrezzo-inbox-20261022

permissions:
  contents: read

jobs:
  forms-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependency
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify native POST forms without sending actual requests
        run: node tools/verify-form-wiring.cjs
